server.port=0

# ===== MQTT 风格设备消息网关配置 =====
# 是否启用文件 WAL 持久化（false 时所有会话状态仅存内存，重启即失）
mqtt-gateway.persistence-enabled=true
# WAL 与快照目录
mqtt-gateway.data-dir=target/gateway-data
# 每个会话的积压容量上限（pipeline 待投 + inflight 待确认 的总条数）
mqtt-gateway.max-backlog-per-session=1000
# 发布线程等待慢客户端管道空位的最长时间，超时返回 BACKPRESSURE_TIMEOUT
mqtt-gateway.enqueue-timeout=2s
# worker 调用设备投递处理器的最长时间，超时本次投递判失败并按 QoS 语义处理
mqtt-gateway.delivery-timeout=5s
# QoS1 投递失败后的重试间隔
mqtt-gateway.retry-interval=200ms
